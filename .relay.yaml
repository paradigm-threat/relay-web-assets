# relay-web-assets — embed + WASM CDN (no React). See relay-gateway/docs/RELAY_WEB_ASSETS.md.

git:
  autoPush:
    branches: ["release"]
    originList:
      - "iad1.relaygateway.net"
      - "sjc1.relaygateway.net"
      - "hkg1.relaygateway.net"
    debounceSeconds: 2
  branchRules:
    branches:
      - name: "*"
        rule:
          requireSigned: true
          allowUnsigned: false
          allowedKeys:
            - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILanag4UriR/4IatVhRxv59gG6/5xEt6ccg/jzINE3R9 relay-catalog-signing"
          adminKeys:
            - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILanag4UriR/4IatVhRxv59gG6/5xEt6ccg/jzINE3R9 relay-catalog-signing"
      - name: develop
        rule:
          allowUnsigned: true
          requireSigned: false
